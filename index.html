<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wildseed</title>
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body class="menu-body">
  <canvas id="menuBg" class="menu-bg" width="480" height="270" aria-hidden="true"></canvas>

  <main class="menu-panel">
    <h1 class="menu-title">WILDSEED</h1>
    <div class="menu-divider" aria-hidden="true"><span>❖</span></div>

    <div class="menu-server">
      <span class="menu-globe" aria-hidden="true"></span>
      <span>SERVER: EU-1&nbsp;&nbsp;|&nbsp;&nbsp;PING: 23ms</span>
    </div>

    <nav class="menu-buttons" aria-label="Main menu">
      <button type="button" class="menu-btn" id="btnPlay">PLAY</button>
      <button type="button" class="menu-btn" id="btnServers">SELECT SERVER</button>
      <button type="button" class="menu-btn" id="btnProfile">
        <span class="menu-icon menu-icon-profile" aria-hidden="true"></span>
        <span>PROFILE</span>
      </button>
      <button type="button" class="menu-btn" id="btnFriends">
        <span class="menu-icon menu-icon-plus" aria-hidden="true">+</span>
        <span>ADD FRIENDS</span>
      </button>
      <button type="button" class="menu-btn" id="btnSignIn">SIGN IN</button>
      <button type="button" class="menu-btn" id="btnSettings">SETTINGS</button>
      <button type="button" class="menu-btn" id="btnExit">EXIT</button>
    </nav>
  </main>

  <script src="js/menu_bg.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
